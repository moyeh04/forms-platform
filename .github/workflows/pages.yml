# Pages Source must be GitHub Actions so the generated configuration is served.
name: Test and deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests and deployment artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Validate GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
          retention-days: 30
      - name: Build configured website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          API_URL: ${{ vars.API_URL }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: npm run build:site
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: site-dist
          path: _site/
          include-hidden-files: true
          retention-days: 7

  apps-script:
    name: Deploy Google Apps Script
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_ID: ${{ vars.APPS_SCRIPT_ID }}
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare validated clasp configuration
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node scripts/prepare-clasp.js
      - uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist/
      - name: Update the existing web deployment
        run: |
          npx --yes @google/clasp@3.4.1 push --force
          npx --yes @google/clasp@3.4.1 deploy -i "$APPS_SCRIPT_DEPLOYMENT_ID" --description "Commit $GITHUB_SHA"
      - name: Remove temporary credentials
        if: always()
        run: |
          node -e "const fs = require('node:fs'); for (const p of [process.env.HOME + '/.clasprc.json', '.clasp.json']) fs.rmSync(p, { force: true });"

  deploy:
    name: Publish to GitHub Pages
    needs: [test, apps-script]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$source" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
