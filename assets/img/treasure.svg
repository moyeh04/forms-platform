<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64">
  <style>
    .s { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; }
    @keyframes twinkle { 0%, 60%, 100% { opacity: 0; transform: scale(.3); } 75% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; } }
  </style>
  <defs>
