# Tests every push and pull request to master. A push to master then deploys:
# the Apps Script backend when a backend file changed, and the website to
# GitHub Pages. Pages Source must be GitHub Actions, because the site is built
# here with the API address filled in; a branch-built site would serve the
# placeholder. docs/operations/DEPLOY.md explains each variable and secret.
name: Test and deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Deploys of one branch run one at a time and none is cancelled, so a newer
# push never stops a backend deploy halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs for every push and pull request: the checks, the tests and both
  # builds. It hands the backend bundle and the configured site to the deploy
  # jobs as artifacts, so they deploy exactly what was tested.
  test:
    name: Tests and deployment artifacts
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.backend.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      # actionlint catches a wrong expression or key in this file before it
      # can skip a deploy without saying so.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Validate GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # A push that touches only the website skips the Apps Script deploy,
      # so a live backend is never redeployed for nothing.
      - name: Check whether the backend changed
        id: backend
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/deploy/backend-changed.js
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
          retention-days: 30
      # Only master builds the site with the live API address; a pull
      # request never sees the repository variables of the deployment.
      - name: Build configured website
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/master'
        env:
          API_URL: ${{ vars.API_URL }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: npm run build:site
      - uses: actions/upload-artifact@v4
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/master'
        with:
          name: site-dist
          path: _site/
          include-hidden-files: true
          retention-days: 7

  # Pushes the tested bundle to the existing Apps Script deployment, only on
  # master and only when a backend file changed. Updating the deployment in
  # place keeps the API address that the site and the clients already hold.
  apps-script:
    name: Deploy Google Apps Script
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      needs.test.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_ID: ${{ vars.APPS_SCRIPT_ID }}
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare validated clasp configuration
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node scripts/deploy/prepare-clasp.js
      - uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist/
      # clasp is pinned to the version setup-deployment.js uses, so the
      # workstation and CI deploy the same way. The step summary names the new
      # backend version and how to go back to the one before it.
      - name: Update the existing web deployment
        run: |
          npx --yes @google/clasp@3.4.1 push --force
          npx --yes @google/clasp@3.4.1 deploy -i "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "Commit $GITHUB_SHA" | tee deploy.log
          version=$(grep -o '@[0-9][0-9]*' deploy.log | tail -n 1)
          {
            echo "Backend version ${version:-unknown} now serves commit" \
              "$GITHUB_SHA. To go back, point the deployment at the version" \
              "before it (docs/operations/DEPLOY.md, Going back to an" \
              "earlier backend)."
          } >> "$GITHUB_STEP_SUMMARY"
      # Runs even when the deploy failed, so the clasp credentials never stay
      # on the runner.
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$HOME/.clasprc.json" .clasp.json

  # Publishes the configured site to GitHub Pages after the backend is live,
  # so the pages never call an action the backend does not have yet. It also
  # runs when the backend job was skipped because no backend file changed.
  deploy:
    name: Publish to GitHub Pages
    needs: [test, apps-script]
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.apps-script.result == 'success' ||
      needs.apps-script.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A Pages site built from a branch would ignore this upload and keep
      # serving the old pages, so the job stops with the setting to change.
      - name: Verify Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$source" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment >" \
              "Source to GitHub Actions."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
